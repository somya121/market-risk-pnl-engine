      AAPL: -0.10
      SPY: -0.10
      MSFT: -0.10
    volatility_shock: 0.00
    rate_shock: 0.00

  - name: "Equity Crash + Volatility Spike"
    description: "Equity selloff accompanied by volatility increase"
    spot_shocks:
      AAPL: -0.15
      SPY: -0.15
      MSFT: -0.15
    volatility_shock: 0.10
    rate_shock: 0.00

