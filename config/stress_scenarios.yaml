      AAPL: 0.00
      SPY: 0.00
      MSFT: 0.00
    volatility_shock: 0.00
    rate_shock: -0.01

  - name: "Combined Market Shock"
    description: "Equity decline, volatility increase and rates increase"
    spot_shocks:
      AAPL: -0.20
      SPY: -0.20
      MSFT: -0.20
    volatility_shock: 0.15
